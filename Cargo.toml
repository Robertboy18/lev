[package]
name = "lev-cli"
version = "2.0.0"
authors = ["Robert Joseph George"]
edition = "2024"
description = "A companion to Lake for large Lean developments: explains rebuilds, checks modules with external kernels, and prunes caches"
license = "MIT"
readme = "README.md"
repository = "https://github.com/robertboy18/lev"
homepage = "https://robertboy18.github.io/lev/"
documentation = "https://docs.rs/lev-cli"
rust-version = "1.85"
keywords = ["lean", "lake", "build", "cache", "theorem-proving"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/.github/**",
    "/scripts/**",
    "/src/**",
    "/lean/**",
    "/tests/**",
    "/schemas/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/LICENSE-MIT",
]

[[bin]]
name = "lev"
path = "src/main.rs"

[lib]
name = "lev"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs2 = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
atomicwrites = "0.4"

# `lev check` hashes kernel binaries and the reference export, a few hundred
# MB per run; unoptimized SHA-256 makes debug builds and tests crawl.
[profile.dev.package.sha2]
opt-level = 3
